    body {

      background: #ffffff;

    h1 { margin-bottom: 10px; }

<body>
 
  <h1>Operaciones de Conjuntos</h1>
  <p>Ingresa dos conjuntos de números enteros separados por comas.</p>

  <form action="conjuntos.php" method="POST">
 
    <label for="conjuntoA">Conjunto A:</label>
    <input type="text" id="conjuntoA" name="conjuntoA" placeholder="Ej: 1, 2, 3, 4" required />
 
    <br/>

    <input type="text" id="conjuntoB" name="conjuntoB" placeholder="Ej: 3, 4, 5, 6" required />
